<div id="bezel">

<div id="hint">&uarr;/W thrust &middot; &larr;/&rarr; or A/D rotate &middot; X abort &middot; tap to start &middot; drag: up = thrust, side = rotate &middot; P pause &middot; M mute &middot; C CRT: <span id="crtlabel">Glass</span></div>
<script>
"use strict";
// ============================================================
// LANDER CLONE — single-file, vanilla JS + canvas
// Reference: Atari's 1979 arcade LUNAR LANDER ("llander"),
// the first vector arcade game.
//   - HUD: SCORE / TIME / FUEL left, ALTITUDE / HORIZONTAL
//     SPEED / VERTICAL SPEED (with direction arrows) right
//   - Jagged straight-line moonscape, flat pads with 2X/4X/5X tiers
//     (narrower pad = bigger multiplier)
//   - View zooms in to a close-up as you near the surface
//   - Fuel pool persists across missions; +50 on a good landing
//   - Good landing 50 pts x multiplier, hard 15 x, crash 5
//   - Crash ends the game
// Cabinet: LANDER bezel art + CRT glass shader (same as PONG).
// ============================================================

const W = 580, H = 435;
const cv = document.getElementById("game");
cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");

// Scale the cabinet to fit the viewport (same approach as PONG).
const PANEL_W = 1440, PANEL_H = 1440; // bezel art canvas size
const bezel = document.getElementById("bezel");
function fitCanvas() {
  const scale = Math.min(1, window.innerWidth / PANEL_W, window.innerHeight / PANEL_H);
  bezel.style.width = Math.floor(PANEL_W * scale) + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

// ---------------- Constants ----------------
const WORLD_W = W;             // single-screen world: the whole level fits on the screen (no scrolling)
const WORLD_H = H;
const WORLD_MARGIN = 16;       // ship can't cross the screen edges
const GRAV = 8;                // world units / s^2
const THRUST = 23;             // main engine accel along nose
const ROT_SPEED = 2.6;         // rad/s while a rotate key is held
const MAX_TILT = 1.40;         // ~80 deg, arcade limited to +-90
const FUEL_START = 750;        // arcade default
const BURN_THRUST = 30;        // fuel / s while main engine on
const BURN_ROT = 4;            // fuel / s while rotating
const ABORT_COST = 120;        // arcade: 120..180
const SHIP_SCALE = 0.30;      // small ship — tiny against the moonscape, like the arcade
const LEG = 14.25 * SHIP_SCALE; // center -> feet, world units
const PAD_INSET = 12 * SHIP_SCALE; // landing tolerance: ship center must sit this far in from the pad edge (scales with the ship)
const MAX_SPEED = 140;
const ZOOM_FAR = 1.0, ZOOM_NEAR = 2.5, ZOOM_CLOSE = 4.5;
const ZOOM_IN_ALT = 120;       // altitude below this -> hard cut to the close-up
const ZOOM_OUT_ALT = 200;      // hysteresis: climb above this -> wide again
const CLOSE_IN_ALT = 60;       // altitude below this -> final 4.5x close-up
const CLOSE_OUT_ALT = 100;     // hysteresis: climb above this -> back to 2.5x

// ---------------- Game State ----------------
let state = "attract"; // attract | ready | play | result | gameover
let stateTimer = 0;
let score = 0;
let fuel = FUEL_START;
let mission = 1;
let missionTime = 0;
let muted = false;
let lastTime = performance.now();
let resultText = [];
let resultCrashed = false;

// Lander
let lander = { x: 20, y: 52, vx: 0, vy: 0, angle: 0 };
let thrusting = false;
let thrustT = 0;               // sustained-thrust timer (long flame state)

// Camera (static wide view -> locked close-up region)
let camScale = ZOOM_FAR, camTarget = ZOOM_FAR;
let camX = W / 2, camY = H / 2;

// Input
let keyThrust = false, keyRotL = false, keyRotR = false;
let touchThrust = false, touchRotL = false, touchRotR = false;
let abortHeld = false;

// ---------------- Terrain ----------------
// Piecewise-linear polyline of STRAIGHT segments (no curves, like the
// original vector hardware). Pad segments are flat and carry a multiplier.
let terrain = { pts: [], segs: [] };
// Pad tiers (the old 4u "2X" pad was cut): width in ship-units + point multiplier.
//   5X = 1u (score 5), 4X = 2u (score 4), 2X = 3u (score 2 — was the 3X pad).
const PAD_TIER = { 5: { u: 1, pts: 5 }, 4: { u: 2, pts: 4 }, 2: { u: 3, pts: 2 } };
let stars = [];

function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function genTerrain(m) {
  // Single-screen world, like the arcade original: the entire moonscape —
  // mountains AND every pad — fits on the one screen. Relief lives in the
  // lower half of the view; peaks never rise above the middle.
  const diff = Math.min(m, 8);
  const GROUND_TOP = 224, GROUND_BOT = 406;
  const UNIT = 28.5 * SHIP_SCALE; // 1 pad-unit = 1 ship-width (foot-to-foot is 28.5 * SHIP_SCALE) — pads shrink with the ship

  // Three pad tiers (see PAD_TIER). 4-pad levels repeat the big 2X pad;
  // 3-pad levels use all three tiers.
  const nPads = 3 + (Math.random() < 0.5 ? 1 : 0);
  const mults = nPads === 4 ? [5, 4, 2, 2] : [5, 4, 2];
  for (let i = mults.length - 1; i > 0; i--) {   // shuffle so size doesn't telegraph position
    const j = Math.floor(Math.random() * (i + 1));
    [mults[i], mults[j]] = [mults[j], mults[i]];
  }
  const padWidth = (m) => PAD_TIER[m].u * UNIT;  // width from the tier table

  const cell = WORLD_W / (nPads + 1);
  const slots = [];
  for (let i = 0; i < nPads; i++) {
    slots.push({
      x: clamp(cell * (i + 1) + rand(-cell * 0.15, cell * 0.15), 60, WORLD_W - 60),
      w: padWidth(mults[i]),
      y: 0,
      mult: mults[i],
    });
  }
  slots.sort((a, b) => a.x - b.x);

  // One jagged slope segment: step right, mostly keep the current direction.
  function slopeStep(x, y, dir) {
    const dx = rand(16, 36);
    // Turn back BEFORE hitting a bound so peaks stay pointy — a flat top can
    // only form by pinning at the bound for several steps
    if (dir < 0 && y - GROUND_TOP < 12) dir = 1;
    if (dir > 0 && GROUND_BOT - y < 12) dir = -1;
    if (Math.random() < 0.25) {
      const nd = -dir;
      // never flip back into a bound we're sitting on
      if (!(y <= GROUND_TOP + 1 && nd < 0) && !(y >= GROUND_BOT - 1 && nd > 0)) dir = nd;
    }
    let mag = rand(14, 34);
    if (Math.random() < 0.35) mag += rand(12, 28); // occasional big push
    y = clamp(y + dir * mag * (0.85 + 0.12 * diff), GROUND_TOP, GROUND_BOT);
    if (y === GROUND_TOP && dir < 0) dir = 1;
    if (y === GROUND_BOT && dir > 0) dir = -1;
    return { x: Math.min(WORLD_W, x + dx), y, dir };
  }
  function walkJagged() {
    const pts = [];
    let st = { x: 0, y: rand(GROUND_TOP + 10, GROUND_BOT - 30),
               dir: Math.random() < 0.5 ? -1 : 1 };
    pts.push({ x: st.x, y: st.y });
    while (st.x < WORLD_W) {
      st = slopeStep(st.x, st.y, st.dir);
      pts.push({ x: st.x, y: st.y });
    }
    return pts;
  }
  // Probe the relief first so each pad sits in a local DIP (the lowest point
  // near its slot) — valley floors and shelves notched into the slope, never
  // table-topped on a peak.
  const probe = walkJagged();
  const probeY = (px) => {
    for (let i = 0; i < probe.length - 1; i++) {
      const a = probe[i], b = probe[i + 1];
      if (px <= b.x) {
        return a.y + (b.x > a.x ? (px - a.x) / (b.x - a.x) * (b.y - a.y) : 0);
      }
    }
    return probe[probe.length - 1].y;
  };
  for (const s of slots) {
    const dip = Math.max(probeY(s.x - 60), probeY(s.x), probeY(s.x + 60)); // max y = lowest nearby
    s.y = clamp(dip + rand(0, 18), GROUND_TOP + 6, GROUND_BOT - 10);
  }

  // Final walk: same jagged relief, inserting each pad as a short sloping
  // ramp into its flat shelf (never a wall).
  const pts = [];
  let x = 0;
  let y = rand(GROUND_TOP + 10, GROUND_BOT - 30);
  let dir = Math.random() < 0.5 ? -1 : 1;  // slope direction w/ persistence
  pts.push({ x, y });
  let si = 0;
  while (x < WORLD_W) {
    if (si < slots.length && x >= slots[si].x - slots[si].w / 2) {
      const s = slots[si++];
      const x0 = x;
      const ramp = rand(26, 48);            // sloping approach to the shelf
      const xr = Math.min(x0 + ramp, WORLD_W - 1);
      pts.push({ x: xr, y: s.y });          // top of the ramp
      x = Math.min(WORLD_W, xr + s.w);
      pts.push({ x, y: s.y, pad: s.mult }); // flat pad
      y = s.y;
    } else {
      ({ x, y, dir } = slopeStep(x, y, dir));
      pts.push({ x, y });
    }
  }
  // Build segment list (flat segments that carry a pad flag are the pads)
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    segs.push({ x0: a.x, x1: b.x, y: a.y, pad: b.pad || 0 });
  }
  terrain = { pts, segs };

  // Star field (parallax when the camera zooms)
  stars = [];
  for (let i = 0; i < Math.round(WORLD_W * 0.13); i++) {
    stars.push({ x: rand(0, WORLD_W), y: rand(6, H - 60), r: Math.random() < 0.85 ? 1 : 2 });
  }
}

function segAt(x) {
  const s = terrain.segs;
  if (x <= s[0].x0) return s[0];
  if (x >= s[s.length - 1].x1) return s[s.length - 1];
  let lo = 0, hi = s.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (s[mid].x1 < x) lo = mid + 1; else hi = mid;
  }
  return s[lo];
}
function groundYat(x) {
  const p = terrain.pts;
  x = clamp(x, 0, WORLD_W);
  let lo = 0, hi = p.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (p[mid].x < x) lo = mid + 1; else hi = mid;
  }
  if (lo === 0) return p[0].y;   // left edge of the world
  const a = p[lo - 1], b = p[lo];
  if (b.x <= a.x) return a.y;
  const t = (x - a.x) / (b.x - a.x);
  return a.y + t * (b.y - a.y);
}
function altitude() {
  return Math.max(0, groundYat(lander.x) - (lander.y + LEG));
}

// ---------------- Camera ----------------
// Arcade camera model: the wide view is completely static — it frames the whole
// one-screen level and never moves. Near the surface it hard-cuts to a 2.5x
// close-up that locks onto a region (4.5x for the landing); the region stays
// fixed until the ship leaves it left, right, or keeps descending, then it
// re-centers on a new one.
function resetCamera() {
  camScale = ZOOM_FAR; camTarget = ZOOM_FAR;
  camX = W / 2; camY = H / 2;
}

function updateCamera(dt) {
  if (state === "play") {
    const alt = altitude();
    if (alt < CLOSE_IN_ALT) camTarget = ZOOM_CLOSE;
    else if (camTarget === ZOOM_CLOSE && alt < CLOSE_OUT_ALT) { /* hold 3x */ }
    else if (alt < ZOOM_IN_ALT) camTarget = ZOOM_NEAR;
    else if (alt > ZOOM_OUT_ALT) camTarget = ZOOM_FAR;
  }
  if (camScale !== camTarget) {
    camScale = camTarget;   // hard cut, no easing
    const halfW = W / (2 * camScale), halfH = H / (2 * camScale);
    if (camScale > ZOOM_FAR) {
      // Frame the ship near centre so the ground below is in view. Only the
      // TOP edge is clamped — the bottom may run off the screen (below the
      // ridge is black fill anyway, so pinning it to the screen bottom just
      // left dead space under the ground).
      camX = clamp(lander.x, halfW, WORLD_W - halfW);
      camY = Math.max(halfH, lander.y + 0.2 * halfH);
    } else {
      camX = W / 2; camY = H / 2;
    }
  } else if (camScale > ZOOM_FAR) {
    // Region-locked: re-center only when the ship leaves left, right, or
    // descends out the bottom (climbing up does not move the view)
    const halfW = W / (2 * camScale), halfH = H / (2 * camScale);
    const M = 38;
    if (lander.x < camX - halfW + M || lander.x > camX + halfW - M ||
        lander.y > camY + halfH - M) {
      camX = clamp(lander.x, halfW, WORLD_W - halfW);
      camY = Math.max(halfH, lander.y + 0.2 * halfH);
    }
  }
}

// ---------------- Missions ----------------
function spawnLander() {
  // Arcade: the ship starts at the top-left corner and drifts in sideways
  lander.x = WORLD_MARGIN + 4;
  lander.y = 52;
  lander.vx = rand(24, 42);
  lander.vy = rand(0, 6);
  lander.angle = 0;
  resetCamera();
  missionTime = 0;
  thrustT = 0;
  lowFuelT = 0;
}
function startMission() {
  spawnLander();
  state = "ready";
  stateTimer = 1.4;
  particles.length = 0;
}
function newGame() {
  score = 0;
  fuel = FUEL_START;
  mission = 1;
  genTerrain(mission);
  startMission();
}

// ---------------- Physics ----------------
function abort() {
  if (abortHeld || state !== "play") return;
  if (fuel < 40) return;
  abortHeld = true;
  setTimeout(() => abortHeld = false, 900);
  lander.angle = 0;        // straighten
  lander.vx = 0;           // kill sideways motion
  lander.vy = -35;         // modest lift off the surface (tamed)
  fuel = Math.max(0, fuel - ABORT_COST);
  sfx.abort();
}

function updatePlay(dt) {
  thrusting = (keyThrust || touchThrust) && fuel > 0;
  thrustT = thrusting ? Math.min(1.5, thrustT + dt) : 0;  // sustained-burn state

  // Rotate (burns a little fuel, like the original)
  let rot = 0;
  if (keyRotL || touchRotL) rot -= 1;
  if (keyRotR || touchRotR) rot += 1;
  if (rot !== 0 && fuel > 0) {
    lander.angle = clamp(lander.angle + rot * ROT_SPEED * dt, -MAX_TILT, MAX_TILT);
    fuel = Math.max(0, fuel - BURN_ROT * dt);
  }
  // Main thrust along the nose
  if (thrusting) {
    lander.vx += Math.sin(lander.angle) * THRUST * dt;
    lander.vy -= Math.cos(lander.angle) * THRUST * dt;
    fuel = Math.max(0, fuel - BURN_THRUST * dt);
  }
  // Gravity
  lander.vy += GRAV * dt;
  // Speed clamp
  const sp = Math.hypot(lander.vx, lander.vy);
  if (sp > MAX_SPEED) { lander.vx *= MAX_SPEED / sp; lander.vy *= MAX_SPEED / sp; }

  // Integrate with substeps so fast landers can't tunnel through cliffs
  const steps = 4, h = dt / steps;
  for (let i = 0; i < steps; i++) {
    lander.x = clamp(lander.x + lander.vx * h, WORLD_MARGIN, WORLD_W - WORLD_MARGIN);
    lander.y += lander.vy * h;
    const gy = groundYat(lander.x);
    if (lander.y + LEG >= gy) {
      lander.y = gy - LEG;
      onContact();
      return;
    }
  }
  missionTime += dt;

  // Low-fuel warning (arcade: high beep on almost-depleted tanks)
  if (fuel > 0 && fuel < 60) {
    lowFuelT -= dt;
    if (lowFuelT <= 0) { sfx.lowFuel(); lowFuelT = 0.9; }
  }
}
let lowFuelT = 0;

function onContact() {
  const seg = segAt(lander.x);
  const onPad = seg.pad > 0 &&
    lander.x >= seg.x0 + PAD_INSET && lander.x <= seg.x1 - PAD_INSET;
  const vDown = lander.vy;
  if (onPad && vDown <= 10 && Math.abs(lander.vx) <= 12) {
    // GOOD LANDING
    const pts = 50 * PAD_TIER[seg.pad].pts;
    score += pts;
    fuel = Math.min(1400, fuel + 50); // arcade fuel bonus
    lander.vx = 0; lander.vy = 0;
    resultText = ["GOOD LANDING", "+" + pts + " PTS", "FUEL +50"];
    sfx.goodLanding();
    endMission(false);
  } else if (onPad && vDown <= 22 && Math.abs(lander.vx) <= 28) {
    // HARD LANDING
    const pts = 15 * PAD_TIER[seg.pad].pts;
    score += pts;
    lander.vx = 0; lander.vy = 0;
    resultText = ["HARD LANDING", "+" + pts + " PTS"];
    sfx.hardLanding();
    endMission(false);
  } else {
    // CRASH (slope, cliff, or too fast)
    score += 5;
    resultText = ["CRASHED", "+5 PTS"];
    sfx.crash();
    explode(lander.x, lander.y);
    endMission(true);
  }
}
function endMission(crashed) {
  resultCrashed = crashed;
  state = "result";
  stateTimer = crashed ? 2.6 : 2.8;
}

// ---------------- Explosion particles ----------------
let particles = [];
function explode(x, y) {
  particles = [];
  for (let i = 0; i < 26; i++) {
    const a = rand(0, Math.PI * 2), v = rand(20, 130);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30,
                     life: rand(0.7, 1.6), max: 1.6 });
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += GRAV * 0.6 * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

// ---------------- Update ----------------
function update(dt) {
  updateParticles(dt);
  updateCamera(dt);   // runs in every state
  if (state === "attract") {
    // Idle drift for the attract screen
    thrusting = false;
    lander.x = clamp(lander.x + Math.sin(performance.now() / 900) * 30 * dt, 100, WORLD_W - 100);
    lander.angle = Math.sin(performance.now() / 1400) * 0.35;
    return;
  }
  if (state === "ready") {
    stateTimer -= dt;
    if (stateTimer <= 0) state = "play";
    return;
  }
  if (state === "result") {
    stateTimer -= dt;
    if (stateTimer <= 0) {
      if (resultCrashed) {
        state = "gameover";
      } else {
        mission++;
        genTerrain(mission);
        startMission();
      }
    }
    return;
  }
  if (state === "gameover") return;
  if (state !== "play") return;
  updatePlay(dt);
}

// ---------------- Rendering ----------------
function w2sX(wx) { return (wx - camX) * camScale + W / 2; }
function w2sY(wy) { return (wy - camY) * camScale + H / 2; }

function drawStars() {
  ctx.fillStyle = "#fff";
  const par = 0.35;
  for (const s of stars) {
    let sx = (s.x - camX * par * camScale) % (W + 30);
    if (sx < 0) sx += W + 30;
    sx -= 15;
    let sy = (s.y - (camY - 217) * 0.12 * camScale) % H;
    if (sy < 0) sy += H;
    if (sx > -2 && sx < W + 2 && sy > 0 && sy < H - 40) {
      ctx.fillRect(sx, sy, s.r, s.r);
    }
  }
}

function drawTerrain() {
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 1;
  ctx.beginPath();
  const pts = terrain.pts;
  let started = false;
  for (let i = 0; i < pts.length; i++) {
    const sx = w2sX(pts[i].x), sy = w2sY(pts[i].y);
    if (sx < -60 || sx > W + 60) { started = false; continue; }
    if (!started) { ctx.moveTo(sx, sy); started = true; }
    else ctx.lineTo(sx, sy);
  }
  ctx.stroke();
  // Opaque ground: fill below the ridge so the star field stays hidden
  // behind the mountains
  ctx.fillStyle = "#000";
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const sx = w2sX(pts[i].x), sy = w2sY(pts[i].y);
    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  }
  ctx.lineTo(W + 80, H + 80);
  ctx.lineTo(-80, H + 80);
  ctx.closePath();
  ctx.fill();
  // Pad shelves: thicker + glow pass so landing zones pop against the relief
  ctx.lineWidth = 3;
  ctx.shadowColor = "#fff";
  ctx.shadowBlur = 7;
  ctx.beginPath();
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if (!b.pad) continue;
    const sx = w2sX(a.x), sy = w2sY(a.y);
    const ex = w2sX(b.x), ey = w2sY(b.y);
    if (Math.max(sx, ex) < -60 || Math.min(sx, ex) > W + 60) continue;
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1;
  // Pad multiplier labels (arcade: "2X", "5X" above the shelf)
  ctx.font = "10px 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  for (const s of terrain.segs) {
    if (!s.pad) continue;
    const mx = w2sX((s.x0 + s.x1) / 2);
    if (mx < -30 || mx > W + 30) continue;
    const my = w2sY(s.y);
    if (my < -20 || my > H + 20) continue;
    ctx.fillText(s.pad + "X", mx, my + 12);
  }
}

function drawLander(sx, sy) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(lander.angle);
  const k = camScale * SHIP_SCALE;
  ctx.scale(k, k);
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 1 / k; // 1 screen pixel, vector-style
  // Apollo-LM lander digitized from the bezel line art (straight lines only).
  // Outline: top, chamfered top corners, long straight side edges
  ctx.beginPath();
  ctx.moveTo(7.2, 3.45);
  ctx.lineTo(7.2, -7.35);
  ctx.lineTo(4.65, -10.05);
  ctx.lineTo(-4.65, -10.05);
  ctx.lineTo(-7.2, -7.35);
  ctx.lineTo(-7.2, 3.45);
  ctx.stroke();
  // Cabin walls + small top-right box
  ctx.beginPath();
  ctx.moveTo(-3.75, -10.05); ctx.lineTo(-3.75, -2.55);
  ctx.moveTo(3.75, -10.05);  ctx.lineTo(3.75, -2.55);
  ctx.moveTo(3.75, -7.35);   ctx.lineTo(7.2, -7.35);
  ctx.stroke();
  // Central engine box (walls run below the bottom line)
  ctx.beginPath();
  ctx.moveTo(-1.35, -6);     ctx.lineTo(1.35, -6);
  ctx.moveTo(-1.35, -6);     ctx.lineTo(-1.35, -1.2);
  ctx.moveTo(1.35, -6);      ctx.lineTo(1.35, -1.2);
  ctx.moveTo(-1.35, -2.85);  ctx.lineTo(1.35, -2.85);
  ctx.stroke();
  // Centerline from the box down to the deck
  ctx.beginPath();
  ctx.moveTo(0, -2.85); ctx.lineTo(0, 2.25);
  ctx.stroke();
  // Side antenna tabs (I-bars)
  ctx.beginPath();
  ctx.moveTo(-10.2, -5.1);  ctx.lineTo(-10.2, -1.05);
  ctx.moveTo(-10.2, -3.45); ctx.lineTo(-3.75, -3.45);
  ctx.moveTo(10.2, -5.1);   ctx.lineTo(10.2, -1.05);
  ctx.moveTo(7.2, -3.45);   ctx.lineTo(10.2, -3.45);
  ctx.stroke();
  // Deck line
  ctx.beginPath();
  ctx.moveTo(-6.15, 2.25); ctx.lineTo(5.85, 2.25);
  ctx.stroke();
  // Foil-crease diagonals fanning out to the side edges
  ctx.beginPath();
  ctx.moveTo(-1.2, -1.05); ctx.lineTo(-7.2, 0.75);
  ctx.moveTo(1.2, -1.05);  ctx.lineTo(7.2, 0.75);
  ctx.stroke();
  // Legs: inner struts, outer legs, foot pads, cross braces, lower chord
  ctx.beginPath();
  ctx.moveTo(-3.75, 1.2);   ctx.lineTo(-3.75, 8.55);
  ctx.moveTo(3.75, 1.2);    ctx.lineTo(3.75, 8.55);
  ctx.moveTo(-7.5, 3.45);   ctx.lineTo(-12.15, 13.95);
  ctx.moveTo(-14.25, 14.25); ctx.lineTo(-9.75, 14.25);
  ctx.moveTo(7.5, 3.45);    ctx.lineTo(12.15, 13.95);
  ctx.moveTo(9.75, 14.25);  ctx.lineTo(14.25, 14.25);
  ctx.moveTo(-3.75, 2.4);   ctx.lineTo(-9.9, 3.75);
  ctx.moveTo(-7.8, 4.2);    ctx.lineTo(-3.75, 8.25);
  ctx.moveTo(3.75, 2.4);    ctx.lineTo(9.9, 3.75);
  ctx.moveTo(7.8, 4.2);     ctx.lineTo(3.75, 8.25);
  ctx.moveTo(-6.45, 8.55);  ctx.lineTo(6.15, 8.55);
  ctx.moveTo(-6.45, 8.55);  ctx.lineTo(-10.95, 10.05);
  ctx.moveTo(6.15, 8.55);   ctx.lineTo(10.95, 10.05);
  ctx.stroke();
  // Engine bell (trapezoid hanging below the chord)
  ctx.beginPath();
  ctx.moveTo(-2.55, 8.55);
  ctx.lineTo(-4.05, 11.25);
  ctx.lineTo(4.05, 11.25);
  ctx.lineTo(2.55, 8.55);
  ctx.stroke();
  // Antenna dish: octagonal ring (straight lines only)
  const dcx = -4.9, dcy = -11.4;
  for (const dr of [1.8, 0.9]) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (Math.PI / 4) * i + Math.PI / 8;
      const px = dcx + dr * Math.cos(a), py = dcy + dr * Math.sin(a);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  }
  // Engine flame (straight flickering lines from the bell). Short taps get a
  // short burst; sustained burns (>0.35 s) ramp a longer flame.
  if (thrusting && (state === "play" || state === "attract")) {
    const sustain = Math.min(1, Math.max(0, thrustT - 0.35) / 0.25);
    const f = 11.25 + 4 + Math.random() * 6 + 9 * sustain;
    ctx.beginPath();
    ctx.moveTo(0, 11.25);    ctx.lineTo(0, f);
    ctx.moveTo(2.5, 11.25);  ctx.lineTo(3.5, f - 4 - 5 * sustain);
    ctx.moveTo(-2.5, 11.25); ctx.lineTo(-3.5, f - 4 - 5 * sustain);
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (const p of particles) {
    const sx = w2sX(p.x), sy = w2sY(p.y);
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + p.vx * 0.03, sy + p.vy * 0.03);
  }
  ctx.globalAlpha = 1;
  ctx.stroke();
}

// ---------------- HUD (matches the original layout) ----------------
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function drawArrow(x, y, dir) {
  // dir: 1 right, -1 left, 2 down, -2 up — straight vector arrow
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 1;
  ctx.beginPath();
  if (dir === 1 || dir === -1) {
    const d = dir;
    ctx.moveTo(x, y); ctx.lineTo(x + 14 * d, y);
    ctx.moveTo(x + 14 * d, y); ctx.lineTo(x + 9 * d, y - 3);
    ctx.moveTo(x + 14 * d, y); ctx.lineTo(x + 9 * d, y + 3);
  } else {
    const d = dir / 2; // 1 = down, -1 = up
    ctx.moveTo(x, y); ctx.lineTo(x, y + 14 * d);
    ctx.moveTo(x, y + 14 * d); ctx.lineTo(x - 3, y + 9 * d);
    ctx.moveTo(x, y + 14 * d); ctx.lineTo(x + 3, y + 9 * d);
  }
  ctx.stroke();
}
function drawHUD() {
  ctx.fillStyle = "#fff";
  ctx.font = "13px 'Courier New', monospace";
  ctx.textAlign = "left";
  const L = 40, LV = 150;
  let y = 30;
  ctx.fillText("SCORE", L, y);
  ctx.textAlign = "right";
  ctx.fillText(String(score).padStart(4, "0"), LV, y);
  ctx.textAlign = "left";
  y += 17;
  ctx.fillText("TIME", L, y);
  ctx.textAlign = "right";
  ctx.fillText(fmtTime(missionTime), LV, y);
  ctx.textAlign = "left";
  y += 17;
  ctx.fillText("FUEL", L, y);
  ctx.textAlign = "right";
  ctx.fillText(String(Math.floor(fuel)).padStart(4, "0"), LV, y);

  // Right block: ALTITUDE / HORIZONTAL SPEED / VERTICAL SPEED + arrows
  const LX = 320, VX = 480;
  ctx.textAlign = "left";
  y = 30;
  ctx.fillText("ALTITUDE", LX, y);
  ctx.textAlign = "right";
  ctx.fillText(String(Math.floor(altitude())), VX, y);
  ctx.textAlign = "left";
  y += 17;
  ctx.fillText("HORIZONTAL SPEED", LX, y);
  ctx.textAlign = "right";
  ctx.fillText(String(Math.floor(Math.abs(lander.vx))), VX, y);
  if (Math.abs(lander.vx) >= 0.5) drawArrow(488, y - 4, lander.vx > 0 ? 1 : -1);
  y += 17;
  ctx.fillText("VERTICAL SPEED", LX, y);
  ctx.textAlign = "right";
  ctx.fillText(String(Math.floor(Math.abs(lander.vy))), VX, y);
  if (Math.abs(lander.vy) >= 0.5) drawArrow(494, y - 4, lander.vy > 0 ? 2 : -2);
  ctx.textAlign = "left";
}

function centerText(lines, yStart, font, color, glow) {
  ctx.textAlign = "center";
  ctx.font = font;
  ctx.fillStyle = color;
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, yStart + i * 22));
  ctx.shadowBlur = 0;
  ctx.textAlign = "left";
}

function render() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  // Camera is advanced in update() (see updateCamera).
  drawStars();
  drawTerrain();

  const inScene = (state !== "gameover") && !(state === "result" && resultCrashed);
  if (inScene) drawLander(w2sX(lander.x), w2sY(lander.y));
  drawParticles();

  if (state === "attract") {
    centerText(["LANDER"], H / 2 - 46, "bold 44px 'Courier New', monospace", "#fff", 14);
    centerText(["A LUNAR LANDING SIMULATION"], H / 2 - 12, "13px 'Courier New', monospace", "#999", 0);
    centerText(["PRESS ANY KEY TO START"], H / 2 + 40, "14px 'Courier New', monospace",
               (Math.floor(performance.now() / 500) % 2 ? "#fff" : "#666"), 0);
    centerText(["UP THRUST  -  ARROWS ROTATE  -  X ABORT"], H / 2 + 66,
               "12px 'Courier New', monospace", "#778", 0);
  } else if (state === "ready") {
    centerText(["MISSION " + mission], H / 2 + 40, "bold 20px 'Courier New', monospace", "#fff", 8);
  } else if (state === "result") {
    centerText(resultText, H / 2 - 10, "bold 20px 'Courier New', monospace",
               resultText[0] === "CRASHED" ? "#fff" : "#fff", 8);
    if (stateTimer < 1.2) {
      centerText(["GET READY"], H / 2 + 44, "13px 'Courier New', monospace", "#889", 0);
    }
  } else if (state === "gameover") {
    centerText(["GAME OVER"], H / 2 - 40, "bold 30px 'Courier New', monospace", "#fff", 12);
    centerText(["FINAL SCORE  " + String(score).padStart(4, "0")], H / 2 - 4,
               "15px 'Courier New', monospace", "#fff", 0);
    centerText(["PRESS ANY KEY TO PLAY AGAIN"], H / 2 + 34, "13px 'Courier New', monospace",
               (Math.floor(performance.now() / 500) % 2 ? "#fff" : "#666"), 0);
  } else if (state === "paused") {
    centerText(["PAUSED"], H / 2, "bold 24px 'Courier New', monospace", "#fff", 10);
  }

  if (state !== "attract" && state !== "gameover") drawHUD();
}

// ---------------- CRT glass (WebGL shader layer) ----------------
// Same shader as PONG / Puck Man: game renders to 2D canvas, uploaded as
// a texture and drawn through a fragment shader (scanlines, barrel
// distortion / tube curvature, glass sheen).
let fx = document.getElementById("fx");
const crtlabel = document.getElementById("crtlabel");
let fxGL = null;

function initFX() {
  const gl = fx.getContext("webgl", { alpha: false });
  if (!gl) return;
  const VS = [
    "attribute vec2 a_pos;",
    "varying vec2 vUv;",
    "void main() {",
    "  vUv = vec2(0.5 + a_pos.x * 0.5, 0.5 - a_pos.y * 0.5);",
    "  gl_Position = vec4(a_pos, 0.0, 1.0);",
    "}",
  ].join("\n");
  const FS = [
    "precision highp float;",
    "varying vec2 vUv;",
    "uniform sampler2D u_tex;",
    "uniform vec2 u_res;",
    "uniform float u_time;",
    "uniform int u_mode; // 0 pass-through, 1 arcade CRT, 2 glass TV",
    "vec3 glow8(sampler2D t, vec2 p, vec2 px) {",
    "  vec3 s = vec3(0.0);",
    "  s += texture2D(t, p + vec2( px.x, 0.0)).rgb;",
    "  s += texture2D(t, p + vec2(-px.x, 0.0)).rgb;",
    "  s += texture2D(t, p + vec2(0.0,  px.y)).rgb;",
    "  s += texture2D(t, p + vec2(0.0, -px.y)).rgb;",
    "  s += texture2D(t, p + vec2(2.0*px.x, 0.0)).rgb;",
    "  s += texture2D(t, p + vec2(-2.0*px.x, 0.0)).rgb;",
    "  s += texture2D(t, p + vec2(0.0, 2.0*px.y)).rgb;",
    "  s += texture2D(t, p + vec2(0.0, -2.0*px.y)).rgb;",
    "  return s * 0.125;",
    "}",
    "void main() {",
    "  vec2 uv = vUv;",
    "  vec2 px = 1.0 / u_res;",
    "  vec2 c = uv - 0.5;",
    "  float r2 = dot(c, c);",
    "  vec3 col;",
    "  if (u_mode == 2) { // glass TV — barrel distortion + scanlines + vignette",
    "    vec2 suv = 0.5 + c * (1.0 + 0.18 * r2);",
    "    if (suv.x < 0.0 || suv.x > 1.0 || suv.y < 0.0 || suv.y > 1.0) {",
    "      gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return;",
    "    }",
    "    col.r = texture2D(u_tex, suv + vec2(0.5, 0.4) * px).r + 0.02;",
    "    col.g = texture2D(u_tex, suv + vec2(0.0, -0.6) * px).g + 0.02;",
    "    col.b = texture2D(u_tex, suv + vec2(-0.9, 0.0) * px).b + 0.02;",
    "    col += (glow8(u_tex, suv, px) - col) * 0.30;",
    "    col = clamp(col * 1.3 + 0.75 * col * col + 1.25 * col * col * col * col * col, vec3(0.0), vec3(10.0));",
    "    float vig = 0.01 + 16.0 * uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y);",
    "    col *= 1.3 * sqrt(vig);",
    "    float scans = clamp(0.35 + 0.18 * sin(u_time * 6.0 - suv.y * u_res.y * 1.5), 0.0, 1.0);",
    "    col *= pow(scans, 0.9);",
    "    col *= 1.0 - 0.23 * clamp(mod(suv.x * u_res.x, 3.0) / 2.0, 0.0, 1.0);",
    "    vec3 fc = max(col, vec3(0.0));",
    "    col = (fc * (6.2 * fc + 0.5)) / (fc * (6.2 * fc + 1.7) + 0.06);",
    "    float d = uv.x * 0.65 + uv.y * 0.75;",
    "    float sheen = exp(-pow((d - 1.08) / 0.16, 2.0)) * 0.05;",
    "    sheen += exp(-pow(length(uv - vec2(0.16, 0.14)) / 0.30, 2.0)) * 0.035;",
    "    col += sheen;",
    "    // --- glass reflections (procedural, ShaderGlass-style) ---",
    "    float fres = clamp(0.10 + 1.8 * r2, 0.0, 1.0);",
    "    float bandPos = uv.x * 0.7 + uv.y * 0.55 - 0.25 - 0.05 * sin(u_time * 0.15);",
    "    float refBand = exp(-pow(bandPos / 0.20, 2.0));",
    "    float refEdge = exp(-pow((bandPos + 0.26) / 0.045, 2.0));",
    "    float refLight = exp(-pow(length(uv - vec2(0.16, 0.18)) / 0.34, 2.0));",
    "    vec3 refl = refBand * vec3(0.10, 0.115, 0.13);",
    "    refl += refEdge * vec3(0.055, 0.065, 0.075);",
    "    refl += refLight * vec3(0.09, 0.085, 0.075);",
    "    col += refl * (0.45 + 0.55 * fres);",
    "    col *= 1.0 + 0.008 * sin(u_time * 377.0);",
    "  } else if (u_mode == 1) { // arcade CRT: scanlines + grille + glow",
    "    col = texture2D(u_tex, uv).rgb;",
    "    float row = fract(uv.y * u_res.y * 0.5);",
    "    col *= 0.80 + 0.20 * cos(row * 6.28318);",
    "    col *= 0.95 + 0.05 * cos(fract(uv.x * u_res.x) * 3.14159);",
    "    col += (glow8(u_tex, uv, px) - col) * 0.40;",
    "    col = vec3(pow(max(col.r, 0.0), 0.625), pow(max(col.g, 0.0), 0.625), pow(max(col.b, 0.0), 0.625));",
    "    col *= 1.0 - 0.30 * smoothstep(0.18, 0.50, r2);",
    "  } else {",
    "    col = texture2D(u_tex, uv).rgb;",
    "  }",
    "  gl_FragColor = vec4(col, 1.0);",
    "}",
  ].join("\n");

  function makeShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s)); return null;
    }
    return s;
  }
  const vs = makeShader(gl.VERTEX_SHADER, VS);
  const fs = makeShader(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return;
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p)); return;
  }
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  fxGL = {
    gl, p, tex,
    aPos: gl.getAttribLocation(p, "a_pos"),
    uTex: gl.getUniformLocation(p, "u_tex"),
    uRes: gl.getUniformLocation(p, "u_res"),
    uTime: gl.getUniformLocation(p, "u_time"),
    uMode: gl.getUniformLocation(p, "u_mode"),
  };
}

function setupFxEvents() {
  fx.addEventListener("webglcontextlost", (e) => {
    e.preventDefault();
    fxGL = null;
    setCRT(0);
  });
  fx.addEventListener("webglcontextrestored", () => {
    initFX();
    setCRT(2);
  });
}

initFX();
setupFxEvents();

let crtMode = 2; // 0 off, 1 arcade, 2 glass
const CRT_NAMES = ["Off", "Arcade", "Glass"];
function setCRT(m) {
  crtMode = fxGL ? m : 0;
  fx.style.display = crtMode === 0 ? "none" : "block";
  if (crtlabel) crtlabel.textContent = fxGL ? CRT_NAMES[crtMode] : "No WebGL";
}
function fxRender(t) {
  const f = fxGL;
  if (!f || crtMode === 0 || f.gl.isContextLost()) return;
  const { gl, p, tex } = f;
  gl.viewport(0, 0, fx.width, fx.height);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.useProgram(p);
  gl.enableVertexAttribArray(f.aPos);
  gl.vertexAttribPointer(f.aPos, 2, gl.FLOAT, false, 0, 0);
  gl.uniform1i(f.uTex, 0);
  gl.uniform2f(f.uRes, W, H);
  gl.uniform1f(f.uTime, t);
  gl.uniform1i(f.uMode, crtMode);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
setCRT(2);

// ---------------- Audio (Web Audio API — same approach as PONG) ----------------
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
// Prime the Web Audio pipeline inside user gestures (needed for the X
// player-card iframe, where audio can only unlock from a gesture).
function primeAudio() {
  const a = audio();
  if (!a) return;
  if (a.state === "suspended") a.resume();
  try {
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0.0001, a.currentTime);
    o.start(); o.stop(a.currentTime + 0.06);
  } catch (e) {}
  ensureEngine();
}
function beep(freq, dur, type, vol, slideTo) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
// Continuous engine sound: filtered white-noise gas thruster. Master gain
// follows the thrust state. Two presets — "arcade" is the ACCEPTED keeper;
// "deep" is the chosen really-low & loud take. Flip ENGINE_PRESET to switch.
const ENGINE_PRESET = "deep";   // "arcade" | "deep"
const ENGINE_CFG = {
  arcade:  { bp: 450, bpQ: 0.7, lp: 260, body: 0.6, scratch: 0,   vol: 0.15 }, // ACCEPTED baseline
  deep:    { bp: 300, bpQ: 1.4, lp: 120, body: 0.7, scratch: 0, vol: 0.25 }, // chosen: really-low & loud, smooth (set scratch>0 to re-enable chop)
};
let engine = null;
function ensureEngine() {
  const a = audio(); if (!a || engine) return;
  const c = ENGINE_CFG[ENGINE_PRESET] || ENGINE_CFG.arcade;
  try {
    // Looping white-noise buffer = the "gas"
    const len = Math.floor(a.sampleRate * 2);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(); src.buffer = buf; src.loop = true;

    const g = a.createGain(); g.gain.value = 0;   // master, follows thrust
    g.connect(a.destination);

    // Low "huff/growl" band tap + sub-bass body tap (body stays smooth for weight)
    const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = c.bp; bp.Q.value = c.bpQ;
    const hissG = a.createGain(); hissG.gain.value = 1.5;
    const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = c.lp;
    const bodyG = a.createGain(); bodyG.gain.value = c.body;
    src.connect(bp); bp.connect(hissG);
    src.connect(lp); lp.connect(bodyG); bodyG.connect(g);

    if (c.scratch > 0) {
      // Scratchy AM: a low square-wave LFO chops the band tap -> gritty sputter
      const lfo = a.createOscillator(); lfo.type = "square"; lfo.frequency.value = c.scratch;
      const depth = a.createGain(); depth.gain.value = 0.31;
      const mod = a.createGain(); mod.gain.value = 0.55;
      lfo.connect(depth); depth.connect(mod.gain); lfo.start();
      hissG.connect(mod); mod.connect(g);
    } else {
      hissG.connect(g);
    }

    src.start();
    engine = { g, vol: c.vol };
  } catch (e) {}
}
function setEngine(on) {
  if (!engine) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const target = (on && !muted) ? engine.vol : 0.0001;
  engine.g.gain.cancelScheduledValues(t);
  // snappy "valve open" attack, gentle "gas easing off" release
  engine.g.gain.setTargetAtTime(target, t, on ? 0.03 : 0.09);
}
function noiseBurst(dur, vol, lowpass) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lowpass;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t);
}
const sfx = {
  goodLanding: () => { beep(660, 0.1, "sine", 0.09); setTimeout(() => beep(880, 0.1, "sine", 0.09), 110); setTimeout(() => beep(1320, 0.18, "sine", 0.09), 220); },
  hardLanding: () => { beep(440, 0.12, "sine", 0.09); setTimeout(() => beep(392, 0.18, "sine", 0.09), 130); },
  crash:     () => { noiseBurst(0.6, 0.35, 900); beep(160, 0.5, "square", 0.1, 40); },
  abort:     () => { beep(180, 0.3, "sawtooth", 0.08, 720); },
  lowFuel:   () => beep(1250, 0.09, "square", 0.06),
};

// ---------------- Input ----------------
function startOrRestart() {
  if (state === "attract") newGame();
  else if (state === "gameover") newGame();
}
window.addEventListener("keydown", (e) => {
  primeAudio();
  if (e.code === "ArrowUp" || e.code === "KeyW") { keyThrust = true; e.preventDefault(); }
  if (e.code === "ArrowLeft" || e.code === "KeyA") { keyRotL = true; e.preventDefault(); }
  if (e.code === "ArrowRight" || e.code === "KeyD") { keyRotR = true; e.preventDefault(); }
  if (e.code === "KeyX" || e.code === "Space") { abort(); e.preventDefault(); }
  if (e.code === "KeyP") {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }
  if (e.code === "KeyM") { muted = !muted; if (muted) setEngine(false); }
  if (e.code === "KeyC") { setCRT((crtMode + 1) % 3); return; }
  if (state === "attract" || state === "gameover") startOrRestart();
});
window.addEventListener("keyup", (e) => {
  if (e.code === "ArrowUp" || e.code === "KeyW") keyThrust = false;
  if (e.code === "ArrowLeft" || e.code === "KeyA") keyRotL = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keyRotR = false;
});

// ---------------- Pointer / touch input ----------------
// Tap = start / restart (also works in the X player-card iframe).
// Drag = steer: up component thrusts, side component rotates.
let touchOrigin = null;
let touchMoved = false;
const SWIPE_MIN = 12;
function beginGesture(e) {
  primeAudio();
  const t = e.touches && e.touches[0];
  if (t) { touchOrigin = { x: t.clientX, y: t.clientY }; touchMoved = false; }
  touchThrust = touchRotL = touchRotR = false;
}
function moveGesture(e) {
  const t = e.touches && e.touches[0];
  if (!t || !touchOrigin) return;
  const dx = t.clientX - touchOrigin.x, dy = t.clientY - touchOrigin.y;
  if (Math.abs(dx) > SWIPE_MIN || Math.abs(dy) > SWIPE_MIN) touchMoved = true;
  if (!touchMoved) return;
  touchThrust = dy < -SWIPE_MIN;
  touchRotL = dx < -SWIPE_MIN;
  touchRotR = dx > SWIPE_MIN;
}
function endGesture(e) {
  primeAudio();
  const c = (e.changedTouches && e.changedTouches[0]) || e;
  const sx = touchOrigin ? touchOrigin.x : c.clientX;
  const sy = touchOrigin ? touchOrigin.y : c.clientY;
  touchOrigin = null;
  const dx = c.clientX - sx, dy = c.clientY - sy;
  if (Math.abs(dx) < SWIPE_MIN && Math.abs(dy) < SWIPE_MIN && !touchMoved) {
    startOrRestart();
  }
  touchThrust = touchRotL = touchRotR = false;
  touchMoved = false;
}
window.addEventListener("touchstart", beginGesture, { passive: true });
window.addEventListener("touchmove", moveGesture, { passive: true });
window.addEventListener("touchend", endGesture);
window.addEventListener("click", endGesture);
window.addEventListener("pointerdown", primeAudio, { passive: true });

// ---------------- Main loop ----------------
genTerrain(1);
spawnLander(); // scenery for the attract screen
lander.x = 180;              // left of the title block
lander.y = 110;              // hover in the upper area, clear of the relief
resetCamera();

function frame(now) {
  let dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  render();
  fxRender(now / 1000);
  // Engine sound follows thrust state
  setEngine(thrusting && state === "play" && !muted);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script>
// Cadet glow: each time a loop finishes, randomly play a variant whose
// steady-bright "constant" hold is 3 / 4 / 5 s (cad3 / cad4 / cad5). The
// breathing + flick pattern is identical; only the pause length varies, so
// it never reads as a fixed repeating loop.
(function () {
  var el = document.getElementById("cadetGlow");
  if (!el) return;
  var names = ["cad2", "cad4", "cad6"];
  function pick() {
    for (var i = 0; i < names.length; i++) el.classList.remove(names[i]);
    void el.offsetWidth; // reflow so re-adding the same name restarts it
    el.classList.add(names[(Math.random() * names.length) | 0]);
  }
  el.addEventListener("animationend", pick);
  pick(); // kick off
})();
</script>
